<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWP B-F</title>

    <style>
        * {
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at top right, #1a1a2e, #050505 60%);
            color: #e2e8f0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            overflow-x: hidden;
            position: relative;
        }

        /* Subtle glowing background aura */
        body::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 50%;
            top: 15%;
            left: 20%;
            filter: blur(80px);
            z-index: 0;
            pointer-events: none;
        }

        .box {
            position: relative;
            z-index: 1;
            width: 90%;
            max-width: 460px;
            background: rgba(16, 16, 18, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.02) inset;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 24px;
            text-align: center;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 30%, #a1a1aa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        .input-group {
            margin-bottom: 18px;
            position: relative;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #94a3b8;
            margin-bottom: 6px;
        }

        input,
        textarea {
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(8, 8, 10, 0.6);
            color: white;
            outline: none;
            font-size: 14px;
            font-family: inherit;
        }

        input:hover,
        textarea:hover {
            border-color: rgba(255, 255, 255, 0.15);
        }

        input:focus,
        textarea:focus {
            border-color: #ffffff;
            background: rgba(12, 12, 15, 0.9);
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.08);
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 8px;
            padding: 15px;
            border: 0;
            border-radius: 12px;
            background: linear-gradient(135deg, #ffffff 0%, #e2e8f0 100%);
            color: #050505;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.15);
        }

        button:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.25);
            background: #ffffff;
        }

        button:active:not(:disabled) {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        #status {
            text-align: center;
            margin-top: 20px;
            color: #94a3b8;
            font-size: 13px;
            line-height: 1.5;
        }

        /* Success state styling when triggered */
        .success-box {
            animation: fadeIn 0.4s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.97); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>

<body>

<div class="box">

    <h1>AWP B-F</h1>

    <form
        id="webhookForm"
        target="webhookFrame"
        method="POST"
        enctype="multipart/form-data"
    >

        <div class="input-group">
            <label for="username">Username</label>
            <input
                id="username"
                type="text"
                placeholder="Enter username"
                maxlength="32"
                required
            >
        </div>

        <div class="input-group">
            <label for="message">Message</label>
            <textarea
                id="message"
                placeholder="Enter your message..."
                maxlength="3000"
                required
            ></textarea>
        </div>

        <div class="input-group">
            <label for="followers">Followers</label>
            <input
                id="followers"
                type="number"
                placeholder="1 - 10,000"
                min="1"
                max="10000"
                required
            >
        </div>

        <button id="submitButton" type="submit">
            Submit Request
        </button>

    </form>

    <iframe
        name="webhookFrame"
        style="display:none"
    ></iframe>

    <div id="status"></div>

</div>

<script>

const WEBHOOK_URL =
    "https://discordapp.com/api/webhooks/1555317187177226412/8vXAuept6gC42GSKCs5QZ_8WbvGbSe6MxhJW8jTYjt_Vh0dkS6WZxpot7Cuft2fl7kjO";


const form =
    document.getElementById("webhookForm");

const username =
    document.getElementById("username");

const message =
    document.getElementById("message");

const followers =
    document.getElementById("followers");

const button =
    document.getElementById("submitButton");

const status =
    document.getElementById("status");


form.addEventListener("submit", function(event) {

    event.preventDefault();

    const user =
        username.value.trim();

    const msg =
        message.value.trim();

    const amount =
        Number(followers.value);


    if (!user || !msg) {
        status.textContent =
            "Fill in all fields.";
        return;
    }


    if (
        amount < 1 ||
        amount > 10000
    ) {
        status.textContent =
            "Followers must be between 1 and 10,000.";
        return;
    }


    /*
        Build Discord webhook payload.
    */

    const payload = {

        username: "AWP B-F",

        embeds: [

            {

                title: "New AWP B-F Request",

                color: 16777215,

                fields: [

                    {
                        name: "Username",
                        value: user,
                        inline: true
                    },

                    {
                        name: "Followers",
                        value: String(amount),
                        inline: true
                    },

                    {
                        name: "Device",
                        value:
                            /Mobi|Android|iPhone|iPad/i.test(
                                navigator.userAgent
                            )
                            ? "Mobile"
                            : "PC",
                        inline: true
                    },

                    {
                        name: "Browser",
                        value: getBrowser(),
                        inline: true
                    },

                    {
                        name: "Date / Time",
                        value:
                            new Date().toLocaleString(),
                        inline: false
                    }

                ],

                description:
                    "**Message:**\n||" +
                    msg +
                    "||",

                footer: {
                    text: "AWP B-F"
                },

                timestamp:
                    new Date().toISOString()

            }

        ]

    };


    /*
        Create a temporary form specifically
        for Discord's webhook endpoint.
    */

    const discordForm =
        document.createElement("form");

    discordForm.method = "POST";

    discordForm.action =
        WEBHOOK_URL;

    discordForm.target =
        "webhookFrame";

    discordForm.enctype =
        "multipart/form-data";


    const payloadInput =
        document.createElement("input");

    payloadInput.type = "hidden";

    payloadInput.name =
        "payload_json";

    payloadInput.value =
        JSON.stringify(payload);


    discordForm.appendChild(
        payloadInput
    );

    document.body.appendChild(
        discordForm
    );


    button.disabled = true;

    button.textContent =
        "Sending...";

    status.textContent =
        "Submitting request...";


    discordForm.submit();


    /*
        We can't read Discord's response because
        this is a cross-origin form submission.

        Wait briefly, then show the next screen.
    */

    setTimeout(() => {

        discordForm.remove();

        form.style.display =
            "none";

        status.innerHTML =
            "✓ Request submitted.<br><br>" +
            "Please allow 10 or more minutes for the next step.";

    }, 1500);

});


function getBrowser() {

    const ua =
        navigator.userAgent;

    if (ua.includes("Edg/"))
        return "Microsoft Edge";

    if (ua.includes("OPR/"))
        return "Opera";

    if (ua.includes("Chrome/"))
        return "Google Chrome";

    if (ua.includes("Firefox/"))
        return "Firefox";

    if (
        ua.includes("Safari/") &&
        !ua.includes("Chrome/")
    )
        return "Safari";

    return "Unknown";
}

</script>

</body>
</html>
